name: Capstone CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint tools
        run: python -m pip install --upgrade pip flake8
      - name: Lint Python files
        run: python -m flake8 server --exclude="migrations,__pycache__" --exit-zero

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci
      - name: Lint JavaScript files
        working-directory: server/frontend
        run: npx eslint src --ext .js,.jsx --format stylish || echo "ESLint completed with findings; continuing CI"

  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest
    needs: [lint-python, lint-javascript]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django system checks
        working-directory: server
        run: python manage.py check
      - name: Apply Django migrations
        working-directory: server
        run: python manage.py migrate --noinput
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci
      - name: Build React frontend
        working-directory: server/frontend
        run: npm run build
